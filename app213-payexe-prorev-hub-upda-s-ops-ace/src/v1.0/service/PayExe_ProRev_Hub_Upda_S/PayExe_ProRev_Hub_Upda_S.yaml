{
  "openapi": "3.0.0",
  "info": {
    "title": "Update-Payment-Execution-Procedure-Reverse-Hub",
    "version": "1.0.0",
    "description": "Servicio reversa de pago en HUB"
  },
  "servers": [
    {
      "url": "/v1.0/s/paymentexecution/procedurereverse/hub/update"
    }
  ],
  "paths": {
    "/": {
      "post": {
        "summary": "Reversar pago de recaudacion en HUB",
        "description": "Servicio reversa de pago en HUB_method",
        "operationId": "UpdatePaymentExecutionProcedureReverseHub",
        "parameters": [
          { "$ref": "#/components/parameters/Bif-Mdw-Id" },
          { "$ref": "#/components/parameters/Bif-Correlation-Id" },
          { "$ref": "#/components/parameters/Bif-Consumer-Id" },
          { "$ref": "#/components/parameters/Time-Stamp" },
          { "$ref": "#/components/parameters/Host-Id" },
          { "$ref": "#/components/parameters/Branch-Code" },
          { "$ref": "#/components/parameters/Country-Code" },
          { "$ref": "#/components/parameters/User-Id" },
          { "$ref": "#/components/parameters/Device-Id" }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/Payload"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Respuesta exitosa",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Response"
                }
              }
            }
          },
          "400": {
            "description": "Bad request",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/health": {
      "get": {
        "summary": "Valida que el servicio este operativo",
        "operationId": "HealthCheck",
        "responses": {
          "200": {
            "description": "success"
          }
        }
      }
    }
  },
  "components": {
    "parameters": {
      "Time-Stamp": {
        "name": "Time-Stamp",
        "in": "header",
        "required": true,
        "schema": {
          "type": "string",
          "minLength": 24,
          "maxLength": 24,
          "pattern": "^\\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\\d|3[01])T([01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d\\.\\d{3}Z$"
        },
        "description": "Fecha y hora de la peticion que envia el canal consumidor.",
        "example": "2025-04-01T21:30:05.660Z"
      },
      "Bif-Correlation-Id": {
        "name": "Bif-Correlation-Id",
        "in": "header",
        "required": true,
        "schema": {
          "type": "string",
          "minLength": 36,
          "maxLength": 36,
          "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
        },
        "description": "Identificador unico de la transaccion desde donde se invoca el servicio.",
        "example": "c73bcdcc-2669-4bf6-81d3-e4ae73fb11fd"
      },
      "Bif-Mdw-Id": {
        "name": "Bif-Mdw-Id",
        "in": "header",
        "required": true,
        "schema": {
          "type": "string",
          "minLength": 6,
          "maxLength": 6,
          "pattern": "^APP\\d{3}$"
        },
        "description": "Encabezado que indica el origen de la solicitud de acceso.",
        "example": "APP222"
      },
      "Bif-Consumer-Id": {
        "name": "Bif-Consumer-Id",
        "in": "header",
        "required": true,
        "schema": {
          "type": "string",
          "minLength": 6,
          "maxLength": 6,
          "pattern": "^APP\\d{3}$"
        },
        "description": "Encabezado que indica el target de la solicitud de acceso.",
        "example": "APP213"
      },
      "Host-Id": {
        "name": "Host-Id",
        "in": "header",
        "required": false,
        "schema": {
          "type": "string",
          "minLength": 7,
          "maxLength": 15,
          "pattern": "^.{7,15}$"
        },
        "description": "Nombre o IP del host al que se envia la solicitud.",
        "example": "123123123"
      },
      "Branch-Code": {
        "name": "Branch-Code",
        "in": "header",
        "required": false,
        "schema": {
          "type": "string",
          "minLength": 5,
          "maxLength": 30,
          "pattern": "^.{5,30}$"
        },
        "description": "Codigo de la sucursal donde se realizo la transaccion.",
        "example": "123123123"
      },
      "Country-Code": {
        "name": "Country-Code",
        "in": "header",
        "required": false,
        "schema": {
          "type": "string",
          "minLength": 5,
          "maxLength": 30,
          "pattern": "^.{5,30}$"
        },
        "description": "Codigo del pais.",
        "example": "123123123"
      },
      "User-Id": {
        "name": "User-Id",
        "in": "header",
        "required": false,
        "schema": {
          "type": "string",
          "minLength": 0,
          "maxLength": 10,
          "pattern": "^.{0,10}$"
        },
        "description": "Identificador del usuario que realizo la transaccion.",
        "example": "123"
      },
      "Device-Id": {
        "name": "Device-Id",
        "in": "header",
        "required": false,
        "schema": {
          "type": "string",
          "minLength": 5,
          "maxLength": 30,
          "pattern": "^.{5,30}$"
        },
        "description": "Identificador del dispositivo desde donde se realizo la transaccion.",
        "example": "123123"
      }
    },
    "schemas": {
      "Payload": {
        "type": "object",
        "required": ["UpdatePaymentExecutionProcedureReverseHub"],
        "properties": {
          "UpdatePaymentExecutionProcedureReverseHub": {
            "type": "object",
            "required": [
              "TransactionReference",
              "TransactionDate",
              "ChannelIdentification",
              "PartyRoleReference",
              "AgreementIdentification",
              "CurrencyCode",
              "NumberOfPayments",
              "IndustryClassification",
              "LoanAmount",
              "Amount",
              "PaymentInstrumentNumber",
              "PaymentMethod",
              "OperationType",
              "DebtsList"
            ],
            "properties": {
              "TransactionReference": {
                "type": "string",
                "minLength": 1,
                "maxLength": 20,
                "pattern": "^[0-9]{1,20}$",
                "description": "Identificador unico de la transaccion origen.",
                "example": "20467534026"
              },
              "TransactionDate": {
                "type": "string",
                "minLength": 1,
                "maxLength": 20,
                "pattern": "^[0-9]{1,20}$",
                "description": "Fecha y hora de la transaccion.",
                "example": "20467534026"
              },
              "ChannelIdentification": {
                "type": "string",
                "minLength": 1,
                "maxLength": 2,
                "pattern": "^[a-zA-Z0-9]{1,2}$",
                "description": "Codigo del canal por el cual se ejecuta la transaccion.",
                "example": "BR"
              },
              "PartyRoleReference": {
                "type": "string",
                "minLength": 1,
                "maxLength": 20,
                "pattern": "^[a-zA-Z0-9]{1,20}$",
                "description": "Codigo del recaudador.",
                "example": "BANBIF"
              },
              "AgreementIdentification": {
                "type": "string",
                "minLength": 1,
                "maxLength": 4,
                "pattern": "^[a-zA-Z0-9]{1,4}$",
                "description": "Codigo del convenio.",
                "example": "398"
              },
              "CurrencyCode": {
                "type": "string",
                "minLength": 1,
                "maxLength": 3,
                "pattern": "^[a-zA-Z]{1,3}$",
                "description": "Codigo de moneda del convenio.",
                "example": "SOL"
              },
              "NumberOfPayments": {
                "type": "string",
                "minLength": 1,
                "maxLength": 5,
                "pattern": "^[a-zA-Z0-9]{1,5}$",
                "description": "Cantidad de pagos.",
                "example": "1"
              },
              "IndustryClassification": {
                "type": "string",
                "minLength": 1,
                "maxLength": 1,
                "pattern": "^[0-9]{1}$",
                "description": "Agrupacion de pagos.",
                "example": "0"
              },
              "LoanAmount": {
                "type": "number",
                "description": "Monto total de la deuda (monto redondeo).",
                "example": 42.17
              },
              "LimitAmount": {
                "type": "number",
                "description": "Monto total saldo.",
                "example": 0
              },
              "Amount": {
                "type": "number",
                "description": "Monto.",
                "example": 0
              },
              "PaymentInstrumentNumber": {
                "type": "string",
                "minLength": 1,
                "maxLength": 20,
                "pattern": "^[a-zA-Z0-9]{1,20}$",
                "description": "Numero de pago.",
                "example": "123123"
              },
              "PaymentMethod": {
                "type": "string",
                "minLength": 1,
                "maxLength": 20,
                "pattern": "^[a-zA-Z0-9]{1,20}$",
                "description": "Medio de pago."
              },
              "OperationType": {
                "type": "string",
                "minLength": 1,
                "maxLength": 30,
                "pattern": "^[a-zA-Z0-9_-]{1,30}$",
                "description": "Tipo de operacion. C=EXACTO, P=PARCIAL, R=R",
                "example": "C"
              },
              "DebtsList": {
                "type": "array",
                "items": {
                  "type": "object",
                  "required": [
                    "ExpiryDate",
                    "InquiryReference",
                    "ServiceList",
                    "DueAmount",
                    "Amount",
                    "PersonIdentification"
                  ],
                  "properties": {
                    "AdditionalInformationList": {
                      "type": "array",
                      "items": {
                        "type": "object",
                        "required": ["Name", "Value"],
                        "properties": {
                          "Name": {
                            "type": "string",
                            "minLength": 1,
                            "maxLength": 20,
                            "pattern": "^[a-zA-Z0-9]{1,20}$",
                            "description": "Nombre del dato adicional.",
                            "example": "CODEBRANCH"
                          },
                          "Value": {
                            "type": "string",
                            "minLength": 1,
                            "maxLength": 20,
                            "pattern": "^[a-zA-Z0-9]{1,20}$",
                            "description": "Valor del dato adicional.",
                            "example": "100"
                          }
                        }
                      }
                    },
                    "ExpiryDate": {
                      "type": "string",
                      "minLength": 1,
                      "maxLength": 8,
                      "pattern": "^[0-9]{1,8}$",
                      "description": "Fecha de vencimiento.",
                      "example": "20180302"
                    },
                    "FullName": {
                      "type": "string",
                      "minLength": 1,
                      "maxLength": 60,
                      "pattern": "^[a-zA-Z\\ ]{1,60}$",
                      "description": "Nombre completo del cliente."
                    },
                    "InquiryReference": {
                      "type": "string",
                      "minLength": 1,
                      "maxLength": 20,
                      "pattern": "^[a-zA-Z0-9]{1,20}$",
                      "description": "ID de consulta.",
                      "example": "24562"
                    },
                    "CampaignIdentifier": {
                      "type": "string",
                      "minLength": 1,
                      "maxLength": 100,
                      "pattern": "^[a-zA-Z0-9 ]{1,100}$",
                      "description": "Glosa de campana."
                    },
                    "ServiceList": {
                      "type": "array",
                      "items": {
                        "type": "object",
                        "required": ["ServiceType"],
                        "properties": {
                          "ServiceType": {
                            "type": "string",
                            "minLength": 1,
                            "maxLength": 20,
                            "pattern": "^[a-zA-Z0-9]{1,20}$",
                            "description": "ID de servicio (suministro). Maximo 3 servicios."
                          }
                        }
                      }
                    },
                    "BalanceAmount": {
                      "type": "number",
                      "description": "Monto del saldo destino.",
                      "example": 0
                    },
                    "DiscountAmount": {
                      "type": "number",
                      "description": "Monto descuento del destino.",
                      "example": 0
                    },
                    "FineAmount": {
                      "type": "number",
                      "description": "Monto multa del destino.",
                      "example": 0
                    },
                    "DueAmount": {
                      "type": "number",
                      "description": "Monto vencido destino.",
                      "example": 40.67
                    },
                    "InterestAmount": {
                      "type": "number",
                      "description": "Monto interes destino.",
                      "example": 0
                    },
                    "AdjustmentAmount": {
                      "type": "number",
                      "description": "Monto reajuste destino.",
                      "example": 0
                    },
                    "Amount": {
                      "type": "number",
                      "description": "Monto total de la deuda.",
                      "example": 3.4
                    },
                    "PersonIdentification": {
                      "type": "string",
                      "minLength": 1,
                      "maxLength": 30,
                      "pattern": "^[a-zA-Z0-9_-]{1,30}$",
                      "description": "Numero de documento.",
                      "example": "121046968"
                    },
                    "PersonIdentificationType": {
                      "type": "string",
                      "minLength": 1,
                      "maxLength": 3,
                      "pattern": "^[a-zA-Z0-9]{1,3}$",
                      "description": "Tipo de documento.",
                      "example": "BOL"
                    }
                  }
                }
              }
            }
          }
        }
      },
      "Response": {
        "type": "object",
        "properties": {
          "UpdatePaymentExecutionProcedureReverseHubResponse": {
            "type": "object",
            "properties": {
              "ResultCode": {
                "type": "string",
                "description": "Codigo de respuesta del backend."
              },
              "ResultMessage": {
                "type": "string",
                "description": "Mensaje de respuesta del backend."
              },
              "TransactionReference": {
                "type": "string",
                "description": "Id de transaccion."
              },
              "TotalNumberOfRecords": {
                "type": "integer",
                "description": "Total de registros."
              }
            }
          }
        }
      },
      "Error": {
        "type": "object",
        "description": "Estructura de error basada en RFC 7807 con extensiones de dominio.",
        "properties": {
          "type": { "type": "string" },
          "title": { "type": "string" },
          "status": { "type": "integer" },
          "detail": { "type": "string" },
          "instance": { "type": "string" },
          "extensions": {
            "type": "object",
            "properties": {
              "UpdatePaymentExecutionProcedureReverseHubResponse": {
                "type": "object",
                "properties": {
                  "Message": {
                    "type": "array",
                    "items": {
                      "type": "object",
                      "properties": {
                        "StatusCode": { "type": "string" },
                        "Message": { "type": "string" },
                        "Status": { "type": "string" }
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}